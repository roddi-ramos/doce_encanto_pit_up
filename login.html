<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Doce Encanto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body class="auth-page">
  <main class="container py-5">
    <div class="auth-card mx-auto p-4 p-md-5">
      <a href="index.html" class="text-decoration-none small">← Voltar ao catálogo</a>
      <h1 class="h3 fw-bold mt-3">Acesse sua conta</h1>
      <p class="text-secondary">Entre ou crie seu cadastro para continuar.</p>

      <div id="message" class="alert d-none" role="alert"></div>

      <form id="login-form" class="mb-4">
        <h2 class="h6 fw-bold">Já tenho cadastro</h2>
        <label class="form-label" for="login-email">E-mail</label>
        <input class="form-control mb-3" id="login-email" type="email" autocomplete="email" required>
        <label class="form-label" for="login-password">Senha</label>
        <input class="form-control mb-3" id="login-password" type="password" autocomplete="current-password" required>
        <button class="btn btn-brand w-100" type="submit">Entrar</button>
      </form>

      <hr>
      <form id="signup-form">
        <h2 class="h6 fw-bold">Criar conta</h2>
        <label class="form-label" for="signup-name">Nome completo</label>
        <input class="form-control mb-3" id="signup-name" autocomplete="name" required>
        <label class="form-label" for="signup-email">E-mail</label>
        <input class="form-control mb-3" id="signup-email" type="email" autocomplete="email" required>
        <label class="form-label" for="signup-password">Senha (mínimo de 8 caracteres)</label>
        <input class="form-control mb-3" id="signup-password" type="password" minlength="8" autocomplete="new-password" required>
        <button class="btn btn-outline-brand w-100" type="submit">Criar cadastro</button>
      </form>
    </div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
