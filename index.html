<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doce Encanto | Cupcakes Gourmet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark brand-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Doce Encanto</a>
      <div class="d-flex gap-2 align-items-center">
        <a class="btn btn-outline-light btn-sm" href="login.html" id="login-link">Entrar</a>
        <a class="btn btn-light btn-sm d-none" href="admin.html" id="admin-link">Administração</a>
        <button class="btn btn-outline-light btn-sm d-none" id="logout-button">Sair</button>
      </div>
    </div>
  </nav>

  <header class="hero py-5">
    <div class="container py-4">
      <p class="text-uppercase small fw-semibold mb-2">Feitos para adoçar seu dia</p>
      <h1 class="display-5 fw-bold">Cupcakes artesanais, feitos com carinho.</h1>
      <p class="lead mb-0">Conheça nosso catálogo de sabores especiais.</p>
    </div>
  </header>

  <main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-4">
      <div>
        <h2 class="section-title mb-1">Nosso catálogo</h2>
        <p class="text-secondary mb-0">Escolha seus favoritos.</p>
      </div>
      <span class="small text-secondary" id="catalog-status" aria-live="polite"></span>
    </div>
    <div class="row g-4" id="products-list">
      <div class="col-12"><div class="alert alert-light">Carregando produtos...</div></div>
    </div>
  </main>

  <footer class="py-4 mt-5">
    <div class="container text-center small text-secondary">Doce Encanto · Projeto acadêmico</div>
  </footer>
  <script src="js/auth.js"></script>
  <script src="js/catalog.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
